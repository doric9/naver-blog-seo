name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run tests
        run: python -m unittest discover tests/ -v

  validate-skills:
    name: Validate skill files are in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run sync script
        run: ./scripts/sync-skills.sh
      - name: Check for changes
        run: |
          if git diff --exit-code; then
            echo "Skills are in sync!"
          else
            echo "ERROR: Skill files are out of sync!"
            echo "Run './scripts/sync-skills.sh' locally and commit the changes."
            exit 1
          fi
